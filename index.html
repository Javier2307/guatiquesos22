<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Guatiquesos - Pedidos</title>


  <style>

    :root {
      --accent1: #ff7f50;
      --accent2: #ffce00;
      --bg: #fffbea;
      --green: #25D366;
      --dark: #222;
      --white: #fff;
      --danger: #d60000;
    }


    * {
      box-sizing: border-box;
    }


    html {
      scroll-behavior: smooth;
    }


    body {
      margin: 0;
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background: var(--bg);
      color: var(--dark);
    }


    /* ==========================================
       HEADER
    ========================================== */

    header {
      background:
        linear-gradient(
          90deg,
          var(--accent1),
          var(--accent2)
        );

      text-align: center;

      padding: 18px 10px;

      box-shadow:
        0 2px 8px rgba(0,0,0,.15);
    }


    .logo-header {
      height: 150px;
      max-width: 90%;
      object-fit: contain;
      transition: transform .2s;
    }


    .logo-header:hover {
      transform: scale(1.05);
    }


    /* ==========================================
       MAIN
    ========================================== */

    main {
      max-width: 1150px;
      margin: 0 auto;
      padding: 20px 14px 90px;
    }


    h2 {
      text-align: center;
      color: var(--accent1);
      margin: 25px 0 20px;
    }


    /* ==========================================
       GRID PRODUCTOS
    ========================================== */

    .productos,
    .bebidas-grid {

      display: grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(220px, 1fr)
        );

      gap: 16px;
    }


    /* ==========================================
       TARJETAS
    ========================================== */

    .card {

      background: var(--white);

      border-radius: 14px;

      padding: 12px;

      box-shadow:
        0 6px 18px
        rgba(0,0,0,.07);

      display: flex;

      flex-direction: column;

      justify-content: space-between;

      min-width: 0;

      transition:
        transform .15s,
        box-shadow .15s;
    }


    .card:hover {

      transform:
        translateY(-5px);

      box-shadow:
        0 10px 28px
        rgba(0,0,0,.12);
    }


    .card img {

      display: block;

      width: 100%;

      height: 165px;

      object-fit: cover;

      border-radius: 9px;

      margin-bottom: 8px;

      background: var(--bg);
    }


    .card h3 {

      margin: 6px 0;

      font-size: 1.05rem;
    }


    .precio {

      color: var(--accent1);

      font-weight: 800;

      margin: 4px 0 7px;
    }


    .descripcion-corta {

      color: #555;

      font-size: .92rem;

      line-height: 1.4;

      min-height: 48px;

      margin: 0 0 10px;
    }


    .card button {

      width: 100%;

      background: var(--accent2);

      border: none;

      padding: 10px;

      border-radius: 8px;

      font-weight: 800;

      cursor: pointer;

      transition: .2s;
    }


    .card button:hover {

      background: var(--accent1);

      color: white;

      transform: scale(1.02);
    }


    /* ==========================================
       BEBIDAS
    ========================================== */

    .bebidas-seccion {
      margin-top: 45px;
    }


    /* ==========================================
       BOTÓN CARRITO
    ========================================== */

    .cart-btn {

      position: fixed;

      left: 22px;

      bottom: 20px;

      background: var(--green);

      color: white;

      border: none;

      padding: 13px 16px;

      border-radius: 12px;

      box-shadow:
        0 8px 20px
        rgba(0,0,0,.22);

      font-weight: 800;

      cursor: pointer;

      z-index: 1200;
    }


    .cart-btn:hover {
      transform: scale(1.03);
    }


    /* ==========================================
       FOOTER
    ========================================== */

    footer {

      text-align: center;

      padding: 14px;

      background: var(--accent2);

      font-weight: 700;
    }


    /* ==========================================
       MODAL
    ========================================== */

    .modal {

      display: none;

      position: fixed;

      inset: 0;

      background:
        rgba(0,0,0,.58);

      align-items: center;

      justify-content: center;

      padding: 18px;

      z-index: 2000;
    }


    .modal-content {

      width: 100%;

      max-width: 650px;

      max-height: 88vh;

      overflow-y: auto;

      background: var(--bg);

      border-radius: 14px;

      padding: 15px;

      box-shadow:
        0 16px 40px
        rgba(0,0,0,.3);

      animation:
        aparecer .22s ease;
    }


    @keyframes aparecer {

      from {
        opacity: 0;
        transform: scale(.94);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }

    }


    .modal-header {

      display: flex;

      gap: 12px;

      align-items: center;

      margin-bottom: 8px;
    }


    .modal-header img {

      width: 140px;

      height: 110px;

      object-fit: cover;

      border-radius: 9px;

      background: white;
    }


    .modal-header h3 {

      margin: 0 0 3px;
    }


    /* ==========================================
       GRUPOS
    ========================================== */

    .group {

      background:
        rgba(255,255,255,.72);

      padding: 11px;

      border-radius: 9px;

      margin-top: 10px;

      border:
        1px solid
        rgba(255,127,80,.18);
    }


    .group h4 {

      margin: 4px 0 8px;

      color: var(--accent1);

      font-size: .99rem;
    }


    .group-description {

      font-size: .82rem;

      color: #666;

      margin-bottom: 7px;

      line-height: 1.35;
    }


    label.inline {

      display: flex;

      gap: 8px;

      align-items: center;

      padding: 5px 0;

      cursor: pointer;
    }


    label.inline input {
      cursor: pointer;
    }


    .extra-price {

      margin-left: auto;

      font-weight: 800;

      color: var(--accent1);
    }


    /* ==========================================
       AVISO SANGUINARIO
    ========================================== */

    .counter-info {

      background: #fff8d7;

      border:
        1px solid
        #ffe16b;

      padding: 9px;

      border-radius: 8px;

      margin-top: 10px;

      font-size: .88rem;

      font-weight: 700;

      line-height: 1.45;
    }


    /* ==========================================
       ERROR
    ========================================== */

    .error-message {

      display: none;

      background: #ffe1e1;

      color: var(--danger);

      border:
        1px solid
        #ff9d9d;

      padding: 9px;

      border-radius: 8px;

      margin-top: 10px;

      font-weight: 700;

      line-height: 1.4;
    }


    /* ==========================================
       TEXTAREA
    ========================================== */

    textarea {

      width: 100%;

      min-height: 70px;

      resize: vertical;

      padding: 9px;

      border-radius: 8px;

      border:
        1px solid
        #dcdcdc;

      margin-top: 8px;

      font-family: inherit;
    }


    /* ==========================================
       TOTAL MODAL
    ========================================== */

    .order-total {

      margin-top: 12px;

      padding: 11px;

      border-radius: 8px;

      background: white;

      display: flex;

      justify-content: space-between;

      align-items: center;

      font-weight: 800;
    }


    /* ==========================================
       BOTONES MODAL
    ========================================== */

    .modal-actions {

      display: flex;

      justify-content: space-between;

      gap: 8px;

      margin-top: 12px;
    }


    .btn-secondary,
    .btn-primary {

      border: none;

      padding: 10px 13px;

      border-radius: 8px;

      cursor: pointer;

      font-weight: 800;
    }


    .btn-secondary {

      background: var(--accent1);

      color: white;
    }


    .btn-primary {

      background: var(--green);

      color: white;
    }


    .btn-secondary:hover,
    .btn-primary:hover {
      transform: scale(1.02);
    }


    /* ==========================================
       CARRITO
    ========================================== */

    .cart-panel {

      position: fixed;

      left: 0;

      top: 0;

      height: 100vh;

      width: 370px;

      max-width: 94%;

      background: white;

      box-shadow:
        8px 0 30px
        rgba(0,0,0,.22);

      z-index: 2500;

      transform:
        translateX(-105%);

      transition:
        transform .25s;

      display: flex;

      flex-direction: column;
    }


    .cart-panel.open {

      transform:
        translateX(0);
    }


    .cart-header {

      padding: 13px;

      border-bottom:
        1px solid #eee;

      display: flex;

      justify-content: space-between;

      align-items: center;
    }


    .cart-body {

      padding: 12px;

      overflow-y: auto;

      flex: 1;
    }


    .cart-item {

      display: flex;

      gap: 8px;

      padding: 9px;

      border-radius: 9px;

      background: var(--bg);

      margin-bottom: 9px;

      align-items: flex-start;
    }


    .cart-item .meta {

      flex: 1;

      min-width: 0;
    }


    .cart-item h4 {

      margin: 0 0 5px;

      font-size: .96rem;
    }


    .cart-item p {

      margin: 0;

      font-size: .84rem;

      color: #444;

      line-height: 1.4;
    }


    .cart-footer {

      padding: 12px;

      border-top:
        1px solid #eee;

      display: flex;

      flex-direction: column;

      gap: 8px;
    }


    .small-muted {

      font-size: .9rem;

      color: #666;
    }


    /* ==========================================
       BOTONES CARRITO
    ========================================== */

    .cart-footer-buttons {

      display: flex;

      gap: 8px;
    }


    .cart-footer-buttons button {

      flex: 1;

      border: none;

      padding: 10px;

      border-radius: 8px;

      font-weight: 800;

      cursor: pointer;
    }


    .clear-btn {

      background: var(--accent1);

      color: white;
    }


    .whatsapp-btn {

      background: var(--green);

      color: white;
    }


    /* ==========================================
       RESPONSIVE
    ========================================== */

    @media (max-width: 520px) {

      .logo-header {
        height: 110px;
      }


      .modal-header {
        flex-direction: column;
        align-items: flex-start;
      }


      .modal-header img {
        width: 100%;
        height: 160px;
      }


      .cart-panel {
        width: 100%;
        max-width: 100%;
      }


      .modal-actions {
        flex-direction: column;
      }


      .btn-secondary,
      .btn-primary {
        width: 100%;
      }

    }

  </style>

</head>

        /* ======================================
           MONEDA
        ====================================== */

        function currency(number) {

          return "$" +
            Number(number).toFixed(2);

        }


        /* ======================================
           SANGUINARIO
        ====================================== */

        function isSanguinario(product) {

          return product &&
            (
              product.name === "Sanguinario" ||
              product.name === "Doble Sanguinario"
            );

        }


        function getRequiredContours(product) {

          if (
            product.name === "Sanguinario"
          ) {

            return 3;

          }


          if (
            product.name === "Doble Sanguinario"
          ) {

            return 4;

          }


          return 0;

        }


        /* ======================================
           CREAR TARJETA
        ====================================== */

        function createCard(
          product,
          buttonText,
          buttonClass,
          callback
        ) {

          const card =
            document.createElement("div");


          card.className =
            "card";


          const img =
            document.createElement("img");


          img.src =
            product.image;


          img.alt =
            product.name;


          img.onerror =
            function () {

              this.style.display =
                "none";

            };


          const title =
            document.createElement("h3");


          title.textContent =
            product.name;


          const price =
            document.createElement("p");


          price.className =
            "precio";


          price.textContent =
            currency(product.price);


          const description =
            document.createElement("p");


          description.className =
            "descripcion-corta";


          description.textContent =
            product.description;


          const button =
            document.createElement("button");


          button.type =
            "button";


          button.className =
            buttonClass;


          button.textContent =
            buttonText;


          button.addEventListener(
            "click",
            callback
          );


          card.appendChild(img);

          card.appendChild(title);

          card.appendChild(price);

          card.appendChild(description);

          card.appendChild(button);


          return card;

        }

        function handleContourSelection(
          event
        ) {

          if (
            !currentProduct
          ) {

            return;

          }


          const required =
            getRequiredContours(
              currentProduct
            );


          const maxDeli =
            required - 2;


          const selected =
            document.querySelectorAll(
              'input[name="contorno_deli"]:checked'
            );


          if (
            selected.length >
            maxDeli
          ) {

            event.target.checked =
              false;


            alert(
              "Este pan solo permite " +
              maxDeli +
              " embutido(s) / delicatessen."
            );

          }

        }

            );


          return Boolean(

        /* ======================================
           CALCULAR TOTAL
        ====================================== */

        function calculateModalTotal() {

          if (
            !currentProduct
          ) {

            return 0;

          }


          let total =
            Number(
              currentProduct.price
            );


          const selectedExtras =
            document.querySelectorAll(
              'input[name="extras"]:checked'
            );


          selectedExtras.forEach(
            function (extra) {

              total +=
                Number(
                  extra.dataset.price ||
                  0
                );

            }
          );


          return Number(
            total.toFixed(2)
          );

        }

        ====================================== */

          modalTotal.textContent =
            currency(
              calculateModalTotal()
            );

        /* ======================================
           VALIDAR PRODUCTO
        ====================================== */

        function validateCurrentProduct() {

          if (
            !currentProduct
          ) {

            return {
              valid: false,
              message:
                "No se ha seleccionado ningún producto."
            };

          }


          /*
             TODOS LOS PANES:
             SOLO UN QUESO
          */

          const cheeseCount =
            document.querySelectorAll(
              'input[name="quesos"]:checked'
            ).length;


          if (
            cheeseCount > 1
          ) {

            return {
              valid: false,
              message:
                "Solo puedes seleccionar un tipo de queso."
            };

          }


          /*
             SANGUINARIO Y DOBLE
          */

          if (
            isSanguinario(
              currentProduct
            )
          ) {

            const required =
              getRequiredContours(
                currentProduct
              );


            const hamCount =
              document.querySelectorAll(
                'input[name="jamones"]:checked'
              ).length;


            const deliCount =
              document.querySelectorAll(
                'input[name="contorno_deli"]:checked'
              ).length;


            const totalContours =
              cheeseCount +
              hamCount +
              deliCount;


            if (
              cheeseCount !== 1
            ) {

              return {
                valid: false,
                message:
                  currentProduct.name +
                  " necesita exactamente 1 tipo de queso."
              };

            }


            if (
              hamCount !== 1
            ) {

              return {
                valid: false,
                message:
                  currentProduct.name +
                  " necesita exactamente 1 tipo de jamón."
              };

            }


            if (
              totalContours !==
              required
            ) {

              return {
                valid: false,
                message:
                  currentProduct.name +
                  " requiere exactamente " +
                  required +
                  " contornos: 1 queso + 1 jamón + " +
                  (required - 2) +
                  " embutido(s)/delicatessen."
              };

            }

          }


          return {
            valid: true,
            message: ""
          };

        }

        /* ======================================
           AGREGAR PAN AL CARRITO
        ====================================== */

        function addCurrentToCart() {

          const validation =
            validateCurrentProduct();


          if (
            !validation.valid
          ) {

            showError(
              validation.message
            );

            return;

          }


          const selections = {};


          /*
             CATEGORÍAS
          */

          CATEGORIES.forEach(
            function (category) {

              const selected =
                document.querySelectorAll(
                  'input[name="' +
                  category.name +
                  '"]:checked'
                );


              selections[
                category.title
              ] =
                Array.from(
                  selected
                ).map(
                  function (input) {
                    return input.value;
                  }
                );

            }
          );


          /*
             DELICATESSEN GRATIS
          */

          if (
            isSanguinario(
              currentProduct
            )
          ) {

            const selectedDeli =
              document.querySelectorAll(
                'input[name="contorno_deli"]:checked'
              );


            selections[
              "Embutidos / Delicatessen incluidos"
            ] =
              Array.from(
                selectedDeli
              ).map(
                function (input) {
                  return input.value;
                }
              );

          }


          /*
             DELICATESSEN PAGADA
          */

          if (
            getSelectedExtraDelicatessen()
          ) {

            const selectedPaidDeli =
              document.querySelectorAll(
                'input[name="delicatessen_extra"]:checked'
              );


            if (
              selectedPaidDeli.length > 0
            ) {

              selections[
                "Delicatessen extra"
              ] =
                Array.from(
                  selectedPaidDeli
                ).map(
                  function (input) {
                    return input.value;
                  }
                );

            }

          }


          /*
             EXTRAS
          */

          const selectedExtras =
            document.querySelectorAll(
              'input[name="extras"]:checked'
            );


          const extras = [];

          let extrasTotal =
            0;


          selectedExtras.forEach(
            function (input) {

              const price =
                Number(
                  input.dataset.price ||
                  0
                );


              extras.push({

                name:
                  input.value,

                price:
                  price

              });


              extrasTotal +=
                price;

            }
          );


          selections["Extras"] =
            extras;


          /*
             TOTAL
          */

          const subtotal =
            Number(
              (
                currentProduct.price +
                extrasTotal
              ).toFixed(2)
            );


          /*
             NOTAS
          */

          const notes =
            pedidoNotas.value.trim();


          /*
             ID
          */

          const id =
            Date.now() +
            Math.random()
              .toString(36)
              .substring(2,8);


          /*
             GUARDAR
          */

          CART.push({

            id:
              id,

            type:
              "bread",

            productName:
              currentProduct.name,

            basePrice:
              currentProduct.price,

            img:
              currentProduct.image,

            selections:
              selections,

            notes:
              notes,

            extrasTotal:
              extrasTotal,

            subtotal:
              subtotal

          });


          updateCartUI();


          closePedidoModal();


          alert(
            "¡Producto agregado al carrito! 🛒"
          );

        }


        /* ======================================
           RESUMEN
        ====================================== */

        function buildSummaryText(
          selections
        ) {

          const lines = [];


          Object.entries(
            selections
          ).forEach(
            function (
              [category, values]
            ) {

              /*
                 EXTRAS
              */

              if (
                category === "Extras"
              ) {

                if (
                  values &&
                  values.length
                ) {

                  const text =
                    values.map(
                      function (extra) {

                        return (
                          extra.name +
                          " (+" +
                          currency(
                            extra.price
                          ) +
                          ")"
                        );

                      }
                    ).join(", ");


                  lines.push(
                    "Extras: " +
                    text
                  );

                }


                return;

              }


              /*
                 RESTO
              */

              if (
                values &&
                values.length
              ) {

                lines.push(
                  category +
                  ": " +
                  values.join(", ")
                );

              }

            }
          );


          return lines.join(
            " • "
          );

        }


        /* ======================================
           ESCAPAR HTML
        ====================================== */

        function escapeHtml(
          value
        ) {

          if (
            value === null ||
            value === undefined
          ) {

            return "";

          }


          const div =
            document.createElement(
              "div"
            );


          div.textContent =
            String(value);


          return div.innerHTML;

        }


        /* ======================================
           ACTUALIZAR CARRITO
        ====================================== */

        function updateCartUI() {

          cartBtn.textContent =
            "🛒 Ver carrito (" +
            CART.length +
            ")";


          cartBody.innerHTML =
            "";


          if (
            CART.length === 0
          ) {

            cartBody.innerHTML = `

              <p class="small-muted">
                No hay pedidos aún.
              </p>

            `;


            cartSubtotalEl.textContent =
              "$0.00";


            return;

          }


          let total =
            0;


          CART.forEach(
            function (item) {

              total +=
                Number(
                  item.subtotal
                );


              const div =
                document.createElement(
                  "div"
                );


              div.className =
                "cart-item";


              /*
                 BEBIDA
              */

              if (
                item.type ===
                "beverage"
              ) {

                div.innerHTML = `

                  <div
                    style="
                      width:64px;
                      height:56px;
                      flex-shrink:0;
                    "
                  >

                    <img
                      src="${escapeHtml(item.img)}"
                      alt="${escapeHtml(item.productName)}"
                      style="
                        width:64px;
                        height:56px;
                        object-fit:cover;
                        border-radius:6px;
                      "
                    >

                  </div>


                  <div class="meta">

                    <h4>

                      ${escapeHtml(
                        item.productName
                      )}

                      <span
                        style="
                          color:#666;
                          font-weight:600;
                          margin-left:4px;
                        "
                      >
                        ${currency(
                          item.subtotal
                        )}
                      </span>

                    </h4>


                    <p>
                      🥤 Bebida
                    </p>

                  </div>


                  <button
                    class="remove-item"
                    data-id="${escapeHtml(item.id)}"
                    type="button"
                    style="
                      background:#ff7f50;
                      color:white;
                      border:none;
                      padding:6px;
                      border-radius:7px;
                      cursor:pointer;
                    "
                  >
                    ✕
                  </button>

                `;

              }


              /*
                 PAN
              */

              else {

                const summary =
                  buildSummaryText(
                    item.selections
                  );


                div.innerHTML = `

                  <div
                    style="
                      width:64px;
                      height:56px;
                      flex-shrink:0;
                    "
                  >

                    <img
                      src="${escapeHtml(item.img)}"
                      alt="${escapeHtml(item.productName)}"
                      style="
                        width:64px;
                        height:56px;
                        object-fit:cover;
                        border-radius:6px;
                      "
                    >

                  </div>


                  <div class="meta">

                    <h4>

                      ${escapeHtml(
                        item.productName
                      )}

                      <span
                        style="
                          color:#666;
                          font-weight:600;
                          margin-left:4px;
                        "
                      >
                        ${currency(
                          item.subtotal
                        )}
                      </span>

                    </h4>


                    <p>
                      ${escapeHtml(
                        summary
                      )}
                    </p>


                    ${
                      item.notes
                        ?
                        `
                          <p
                            style="
                              margin-top:6px;
                            "
                          >

                            <strong>
                              Notas:
                            </strong>

                            ${escapeHtml(
                              item.notes
                            )}

                          </p>
                        `
                        :
                        ""
                    }

                  </div>


                  <button
                    class="remove-item"
                    data-id="${escapeHtml(item.id)}"
                    type="button"
                    style="
                      background:#ff7f50;
                      color:white;
                      border:none;
                      padding:6px;
                      border-radius:7px;
                      cursor:pointer;
                    "
                  >
                    ✕
                  </button>

                `;

              }


              cartBody.appendChild(
                div
              );

            }
          );


          cartSubtotalEl.textContent =
            currency(total);


          /*
             BOTONES ELIMINAR
          */

          cartBody
            .querySelectorAll(
              ".remove-item"
            )
            .forEach(
              function (button) {

                button.addEventListener(
                  "click",
                  function () {

                    CART =
                      CART.filter(
                        function (item) {

                          return (
                            item.id !==
                            button.dataset.id
                          );

                        }
                      );


                    updateCartUI();

                  }
                );

              }
            );

        }


        /* ======================================
           VACIAR CARRITO
        ====================================== */

        function clearCart() {

          if (
            CART.length === 0
          ) {

            return;

          }


          if (
            !confirm(
              "¿Vaciar todo el carrito?"
            )
          ) {

            return;

          }


          CART = [];


          updateCartUI();

        }


        /* ======================================
           WHATSAPP
        ====================================== */

        function sendCartWhatsApp() {

          if (
            CART.length === 0
          ) {

            alert(
              "El carrito está vacío."
            );

            return;

          }


          if (
            !/^\d{6,}$/.test(
              WHATSAPP_NUMBER
            )
          ) {

            alert(
              "Revisa el número de WhatsApp."
            );

            return;

          }


          let total =
            0;


          const messageLines =
            [];


          messageLines.push(
            "*PEDIDO GUATIQUESOS*"
          );


          messageLines.push("");


          CART.forEach(
            function (
              item,
              index
            ) {

              messageLines.push(
                "*" +
                (index + 1) +
                ". " +
                item.productName +
                "*"
              );


              if (
                item.type ===
                "beverage"
              ) {

                messageLines.push(
                  "Tipo: Bebida"
                );

              }


              messageLines.push(
                "Precio: " +
                currency(
                  item.subtotal
                )
              );


              Object.entries(
                item.selections
              ).forEach(
                function (
                  [category, values]
                ) {

                  if (
                    category ===
                    "Extras"
                  ) {

                    if (
                      values &&
                      values.length
                    ) {

                      values.forEach(
                        function (
                          extra
                        ) {

                          messageLines.push(
                            "Extra: " +
                            extra.name +
                            " (+" +
                            currency(
                              extra.price
                            ) +
                            ")"
                          );

                        }
                      );

                    }


                    return;

                  }


                  if (
                    values &&
                    values.length
                  ) {

                    messageLines.push(
                      category +
                      ": " +
                      values.join(", ")
                    );

                  }

                }
              );


              if (
                item.notes
              ) {

                messageLines.push(
                  "Notas: " +
                  item.notes
                );

              }


              messageLines.push("");


              total +=
                Number(
                  item.subtotal
                );

            }
          );


          messageLines.push(
            "*TOTAL: " +
            currency(total) +
            "*"
          );


          messageLines.push("");


          messageLines.push(
            "Por favor confirmar disponibilidad."
          );


          const message =
            messageLines.join(
              "\n"
            );


          const url =
            "https://wa.me/" +
            WHATSAPP_NUMBER +
            "?text=" +
            encodeURIComponent(
              message
            );


          window.open(
            url,
            "_blank"
          );

        }


        /* ======================================
           EVENTOS
        ====================================== */

        closePedido.addEventListener(
          "click",
          closePedidoModal
        );


        addToCartBtn.addEventListener(
          "click",
          addCurrentToCart
        );


        cartBtn.addEventListener(
          "click",
          function () {

            cartPanel.classList.add(
              "open"
            );


            cartPanel.setAttribute(
              "aria-hidden",
              "false"
            );

          }
        );


        closeCartBtn.addEventListener(
          "click",
          function () {

            cartPanel.classList.remove(
              "open"
            );


            cartPanel.setAttribute(
              "aria-hidden",
              "true"
            );

          }
        );


        clearCartBtn.addEventListener(
          "click",
          clearCart
        );


        sendWhatsAppBtn.addEventListener(
          "click",
          sendCartWhatsApp
        );


        pedidoModal.addEventListener(
          "click",
          function (event) {

            if (
              event.target ===
              pedidoModal
            ) {

              closePedidoModal();

            }

          }
        );


        document.addEventListener(
          "keydown",
          function (event) {

            if (
              event.key ===
              "Escape"
            ) {

              closePedidoModal();


              cartPanel.classList.remove(
                "open"
              );

            }

          }
        );


        /* ======================================
           INICIAR PÁGINA
        ====================================== */

        renderProducts();

        renderBeverages();

        updateCartUI();


      }
    );

  </script>

</body>
</html>
