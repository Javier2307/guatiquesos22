  <style>

    :root {
      --accent1: #ff7f50;
      --accent2: #ffce00;
      --bg: #fffbea;
      --green: #25D366;
      --dark: #222;
      --white: #fff;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system,
        "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--dark);
    }


    /* =========================
       HEADER
    ========================= */

    header {
      background: linear-gradient(
        90deg,
        var(--accent1),
        var(--accent2)
      );

      text-align: center;
      padding: 1rem 0;

      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    .logo-header {
      height: 150px;
      max-width: 90%;
      object-fit: contain;
      transition: transform .2s;
    }

    .logo-header:hover {
      transform: scale(1.05);
    }


    /* =========================
       CONTENIDO
    ========================= */

    main {
      max-width: 1100px;
      margin: 18px auto;
      padding: 0 12px;
    }

    h2 {
      text-align: center;
      color: var(--accent1);
      margin: 25px 0 18px;
    }


    /* =========================
       PRODUCTOS
    ========================= */

    .productos {
      display: grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(220px, 1fr)
        );

      gap: 14px;
    }

    .card {
      background: var(--white);

      border-radius: 12px;

      padding: 12px;

      box-shadow:
        0 6px 18px rgba(0,0,0,0.06);

      display: flex;
      flex-direction: column;
      justify-content: space-between;

      transition:
        transform .15s,
        box-shadow .15s;
    }

    .card:hover {
      transform: translateY(-6px);

      box-shadow:
        0 10px 28px rgba(0,0,0,0.12);
    }

    .card img {
      width: 100%;
      height: 150px;

      object-fit: cover;

      border-radius: 8px;

      margin-bottom: 8px;

      background: var(--bg);
    }

    .card h3 {
      margin: 6px 0;
      font-size: 1.02rem;
    }

    .precio {
      color: var(--accent1);
      font-weight: 800;
      margin-bottom: 6px;
    }

    .descripcion-corta {
      color: #555;
      font-size: .92rem;

      min-height: 40px;

      margin-bottom: 8px;
    }

    .card button {
      background: var(--accent2);

      border: none;

      padding: 9px 10px;

      border-radius: 8px;

      font-weight: 700;

      cursor: pointer;

      transition: .2s;
    }

    .card button:hover {
      background: var(--accent1);
      color: white;

      transform: scale(1.03);
    }


    /* =========================
       BOTÓN CARRITO
    ========================= */

    .cart-btn {
      position: fixed;

      right: 18px;
      bottom: 18px;

      background: var(--green);

      color: white;

      border: none;

      padding: 12px 14px;

      border-radius: 12px;

      box-shadow:
        0 8px 20px rgba(0,0,0,0.2);

      font-weight: 800;

      cursor: pointer;

      z-index: 1200;
    }


    /* =========================
       FOOTER
    ========================= */

    footer {
      text-align: center;

      padding: 12px;

      margin-top: 25px;

      background: var(--accent2);

      font-weight: 700;
    }


    /* =========================
       MODAL PEDIDO
    ========================= */

    .modal {
      display: none;

      position: fixed;

      inset: 0;

      background:
        rgba(0,0,0,0.55);

      align-items: center;
      justify-content: center;

      padding: 18px;

      z-index: 1100;
    }

    .modal-content {
      width: 100%;

      max-width: 640px;

      max-height: 86vh;

      overflow-y: auto;

      background: var(--bg);

      border-radius: 12px;

      padding: 14px;

      box-shadow:
        0 16px 40px rgba(0,0,0,0.25);

      animation: aparecer .25s ease;
    }

    @keyframes aparecer {

      from {
        opacity: 0;
        transform: scale(.92);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }

    }

    .modal-header {
      display: flex;

      gap: 12px;

      align-items: center;
    }

    .modal img {
      width: 140px;
      height: 110px;

      object-fit: cover;

      border-radius: 8px;
    }

    .modal h3 {
      margin: 0;

      font-size: 1.15rem;
    }

    .modal .precio {
      margin: 2px 0 0;
    }


    /* =========================
       GRUPOS
    ========================= */

    .group {
      background:
        rgba(255,255,255,.65);

      padding: 10px;

      border-radius: 8px;

      margin-top: 10px;

      border:
        1px solid rgba(255,127,80,.15);
    }

    .group h4 {
      margin: 5px 0 8px;

      color: var(--accent1);

      font-size: .98rem;
    }

    .group-description {
      font-size: .82rem;
      color: #666;
      margin-bottom: 6px;
    }

    label.inline {
      display: flex;

      gap: 8px;

      align-items: center;

      padding: 5px 0;

      cursor: pointer;
    }

    label.inline input {
      cursor: pointer;
    }

    .extra-price {
      margin-left: auto;

      font-weight: 800;

      color: var(--accent1);
    }


    /* =========================
       COMENTARIOS
    ========================= */

    textarea {
      width: 100%;

      min-height: 66px;

      resize: none;

      padding: 8px;

      border-radius: 8px;

      border: 1px solid #dcdcdc;

      margin-top: 8px;

      font-family: inherit;
    }


    /* =========================
       BOTONES MODAL
    ========================= */

    .modal-actions {
      display: flex;

      justify-content: space-between;

      gap: 8px;

      margin-top: 12px;
    }

    .btn-secondary {
      background: var(--accent1);

      color: white;

      border: none;

      padding: 9px 12px;

      border-radius: 8px;

      cursor: pointer;

      font-weight: 700;
    }

    .btn-primary {
      background: var(--green);

      color: white;

      border: none;

      padding: 9px 12px;

      border-radius: 8px;

      cursor: pointer;

      font-weight: 800;
    }

    .btn-secondary:hover,
    .btn-primary:hover {
      transform: scale(1.03);
    }


    /* =========================
       CARRITO
    ========================= */

    .cart-panel {
      position: fixed;

      right: 0;
      top: 0;

      height: 100vh;

      width: 360px;

      max-width: 92%;

      background: white;

      box-shadow:
        -8px 0 30px rgba(0,0,0,.2);

      z-index: 1300;

      transform: translateX(100%);

      transition:
        transform .25s;

      display: flex;

      flex-direction: column;
    }

    .cart-panel.open {
      transform: translateX(0);
    }

    .cart-header {
      padding: 12px;

      border-bottom:
        1px solid #eee;

      display: flex;

      justify-content:
        space-between;

      align-items: center;
    }

    .cart-body {
      padding: 12px;

      overflow-y: auto;

      flex: 1;
    }

    .cart-item {
      display: flex;

      gap: 8px;

      padding: 8px;

      border-radius: 8px;

      background: var(--bg);

      margin-bottom: 8px;

      align-items: flex-start;
    }

    .cart-item .meta {
      flex: 1;
    }

    .cart-item h4 {
      margin: 0 0 4px;

      font-size: .96rem;
    }

    .cart-item p {
      margin: 0;

      font-size: .88rem;

      color: #444;
    }

    .cart-footer {
      padding: 12px;

      border-top:
        1px solid #eee;

      display: flex;

      flex-direction: column;

      gap: 8px;
    }

    .small-muted {
      font-size: .9rem;
      color: #666;
    }


    /* =========================
       RESUMEN PRECIO MODAL
    ========================= */

    .order-total {
      margin-top: 12px;

      border-radius: 8px;

      background: #fff;

      display: flex;

      justify-content: space-between;

      align-items: center;

    }

       RESPONSIVE
    ========================= */

      .logo-header {
        height: 110px;
      }

      .modal img {
        display: none;
      }

      .modal-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
      }

      .cart-panel {
        width: 100%;
        max-width: 100%;
      }

      .modal-actions {
        flex-direction: column;
      }

      .btn-secondary,
      .btn-primary {
        width: 100%;
      }

    }

  </style>

</head>

  document.getElementById("pedidoModal");

const pedidoImg =
  document.getElementById("pedidoImg");

const pedidoTitle =
  document.getElementById("pedidoTitle");

const pedidoPrice =
  document.getElementById("pedidoPrice");

const ingredientesContainer =
  document.getElementById("ingredientesContainer");

const pedidoNotas =
  document.getElementById("pedidoNotas");

const modalTotal =
  document.getElementById("modalTotal");

const addToCartBtn =
  document.getElementById("addToCartBtn");

const closePedido =
  document.getElementById("closePedido");

const cartBtn =
  document.getElementById("openCart");

const cartPanel =
  document.getElementById("cartPanel");

const cartBody =
  document.getElementById("cartBody");

const closeCartBtn =
  document.getElementById("closeCartBtn");

const cartSubtotalEl =
  document.getElementById("cartSubtotal");

const clearCartBtn =
  document.getElementById("clearCart");

const sendWhatsAppBtn =
  document.getElementById("sendWhatsApp");


/* =====================================================
   FORMATO MONEDA
===================================================== */

function currency(number) {

  return "$" +
    Number(number).toFixed(2);

}


/* =====================================================
   ¿ES SANGUINARIO?
===================================================== */

function isSanguinario(product) {

  return product &&
    (
      product.name === "Sanguinario" ||
      product.name === "Doble Sanguinario"
    );

}


/* =====================================================
   ¿CATEGORÍA GRATIS?
===================================================== */

function isFreeSanguinarioCategory(categoryName) {

  return (
    categoryName === "quesos" ||
    categoryName === "jamones" ||
    categoryName === "delicatessen"
  );

}


/* =====================================================
   CREAR PRODUCTOS
===================================================== */

function renderProducts() {

  productosPanes.innerHTML = "";

  PRODUCTS.forEach(product => {

    const card =
      document.createElement("div");

    card.className = "card";


    card.innerHTML = `

      <img
        src="${product.image}"
        alt="${product.name}"
      >

      <h3>
        ${product.name}
      </h3>

      <p class="precio">
        ${currency(product.price)}
      </p>

      <p class="descripcion-corta">
        ${product.description}
      </p>

      <button
        type="button"
        class="pedir-btn"
      >
        Pedir
      </button>

    `;


    card
      .querySelector(".pedir-btn")
      .addEventListener(
        "click",
        () => openPedidoModal(product)
      );


    productosPanes.appendChild(card);

  });

}


/* =====================================================
   ABRIR MENÚ DE PEDIDO
===================================================== */

function openPedidoModal(product) {

  currentProduct = product;


  pedidoImg.src =
    product.image;

  pedidoImg.alt =
    product.name;

  pedidoTitle.textContent =
    product.name;

  pedidoPrice.textContent =
    currency(product.price);


  ingredientesContainer.innerHTML =
    "";


  const esSanguinario =
    isSanguinario(product);


  /* =====================================================
     CATEGORÍAS
  ===================================================== */

  CATEGORIES.forEach(category => {

    const group =
      document.createElement("div");

    group.className =
      "group";


    const title =
      document.createElement("h4");

    title.textContent =
      category.title;


    group.appendChild(title);


    category.items.forEach(item => {

      const label =
        document.createElement("label");

      label.className =
        "inline";


      const input =
        document.createElement("input");

      input.type =
        category.type;

      input.name =
        category.name;

      input.value =
        item;


      /*
       * PARA SANGUINARIO:
       *
       * QUESO = GRATIS
       * JAMÓN = GRATIS
       * DELICATESSEN = GRATIS
       */

      let price = 0;


      if (
        !esSanguinario ||
        !isFreeSanguinarioCategory(category.name)
      ) {

        price = 0;

      }


      input.dataset.price =
        price;


      input.addEventListener(
        "change",
        updateModalTotal
      );


      const span =
        document.createElement("span");

      span.textContent =
        item;


      label.appendChild(input);

      label.appendChild(span);


      /*
       * Mostrar GRATIS para Sanguinario
       */

      if (
        esSanguinario &&
        isFreeSanguinarioCategory(category.name)
      ) {

        const priceLabel =
          document.createElement("span");

        priceLabel.className =
          "extra-price";

        priceLabel.textContent =
          "GRATIS ($0.00)";


        label.appendChild(
          priceLabel
        );

      }


      group.appendChild(label);

    });


    ingredientesContainer
      .appendChild(group);

  });


  /* =====================================================
     EMBUTIDOS ESPECIALES
  ===================================================== */

  if (esSanguinario) {

    const config =
      SANGUINARIO_OPTIONS[
        product.name
      ];


    const group =
      document.createElement("div");

    group.className =
      "group";


    const title =
      document.createElement("h4");

    title.textContent =
      "Embutidos incluidos";


    group.appendChild(title);


    const description =
      document.createElement("div");

    description.className =
      "group-description";


    if (
      product.name === "Sanguinario"
    ) {

      description.textContent =
        "Selecciona 1 embutido. Todos están incluidos en el precio.";

    } else {

      description.textContent =
        "Selecciona 2 embutidos. Ambos están incluidos en el precio.";

    }


    group.appendChild(
      description
    );


    config.embutidos.forEach(item => {

      const label =
        document.createElement("label");

      label.className =
        "inline";


      const input =
        document.createElement("input");


      /*
       * SANGUINARIO:
       * SOLO UNO
       *
       * DOBLE SANGUINARIO:
       * DOS
       */

      if (
        product.name === "Sanguinario"
      ) {

        input.type =
          "radio";

        input.name =
          "embutido_sanguinario";

      } else {

        input.type =
          "checkbox";

        input.name =
          "embutidos_doble_sanguinario";

      }


      input.value =
        item;

      input.dataset.price =
        "0";


      input.addEventListener(
        "change",
        updateModalTotal
      );


      const span =
        document.createElement("span");

      span.textContent =
        item;


      label.appendChild(input);

      label.appendChild(span);


      const price =
        document.createElement("span");

      price.className =
        "extra-price";

      price.textContent =
        "GRATIS ($0.00)";


      label.appendChild(price);


      group.appendChild(label);

    });


    ingredientesContainer
      .appendChild(group);

  }


  /* =====================================================
     EXTRAS
  ===================================================== */

  const extrasMainGroup =
    document.createElement("div");

  extrasMainGroup.className =
    "group";


  const extrasTitle =
    document.createElement("h4");

  extrasTitle.textContent =
    "Extras";


  extrasMainGroup.appendChild(
    extrasTitle
  );


  const extrasDescription =
    document.createElement("div");

  extrasDescription.className =
    "group-description";

  extrasDescription.textContent =
    "Los productos de esta sección sí tienen costo adicional.";


  extrasMainGroup.appendChild(
    extrasDescription
  );


  EXTRA_GROUPS.forEach(groupData => {

    const subgroup =
      document.createElement("div");

    subgroup.style.marginTop =
      "10px";


    const subgroupTitle =
      document.createElement("strong");

    subgroupTitle.style.display =
      "block";

    subgroupTitle.style.marginBottom =
      "5px";

    subgroupTitle.textContent =
      `${groupData.title} — ${currency(groupData.price)}`;


    subgroup.appendChild(
      subgroupTitle
    );


    groupData.items.forEach(item => {

      const label =
        document.createElement("label");

      label.className =
        "inline";


      const input =
        document.createElement("input");

      input.type =
        "checkbox";

      input.name =
        "extras";

      input.value =
        item;

      input.dataset.price =
        groupData.price;


      input.addEventListener(
        "change",
        updateModalTotal
      );


      const span =
        document.createElement("span");

      span.textContent =
        item;


      const price =
        document.createElement("span");

      price.className =
        "extra-price";

      price.textContent =
        `+${currency(groupData.price)}`;


      label.appendChild(input);

      label.appendChild(span);

      label.appendChild(price);


      subgroup.appendChild(label);

    });


    extrasMainGroup.appendChild(
      subgroup
    );

  });


  ingredientesContainer
    .appendChild(extrasMainGroup);


  pedidoNotas.value =
    "";


  modalTotal.textContent =
    currency(product.price);


  pedidoModal.style.display =
    "flex";


  pedidoModal.setAttribute(
    "aria-hidden",
    "false"
  );

}


/* =====================================================
   CALCULAR TOTAL
===================================================== */

function calculateModalTotal() {

  if (!currentProduct) {
    return 0;
  }


  let total =
    currentProduct.price;


  /*
   * SOLO SE SUMAN LOS INPUTS
   * QUE TENGAN PRECIO MAYOR A 0.
   *
   * QUESOS, JAMONES, DELICATESSEN
   * Y EMBUTIDOS DE SANGUINARIO
   * TIENEN PRECIO 0.
   */

  const selectedInputs =
    document.querySelectorAll(
      '#ingredientesContainer input[data-price]:checked'
    );


  selectedInputs.forEach(input => {

    const price =
      Number(
        input.dataset.price || 0
      );


    total +=
      price;

  });


  return Number(
    total.toFixed(2)
  );

}


/* =====================================================
   ACTUALIZAR TOTAL
===================================================== */

function updateModalTotal() {

  modalTotal.textContent =
    currency(
      calculateModalTotal()
    );

}


/* =====================================================
   CERRAR MODAL
===================================================== */

function closePedidoModal() {

  pedidoModal.style.display =
    "none";


  pedidoModal.setAttribute(
    "aria-hidden",
    "true"
  );


  currentProduct =
    null;

}


/* =====================================================
   AGREGAR AL CARRITO
===================================================== */

function addCurrentToCart() {

  if (!currentProduct) {

    alert(
      "No se ha seleccionado ningún producto."
    );

    return;
  }


  const selections = {};


  /* =====================================================
     CATEGORÍAS
  ===================================================== */

  CATEGORIES.forEach(category => {

    const selected =
      document.querySelectorAll(
        `input[name="${category.name}"]:checked`
      );


    selections[category.title] =
      Array.from(selected)
        .map(input => ({

          name:
            input.value,

          price:
            Number(
              input.dataset.price || 0
            )

        }));

  });


  /* =====================================================
     EMBUTIDOS SANGUINARIO
  ===================================================== */

  if (
    currentProduct.name === "Sanguinario"
  ) {

    const selected =
      document.querySelectorAll(
        'input[name="embutido_sanguinario"]:checked'
      );


    selections["Embutidos"] =
      Array.from(selected)
        .map(input => ({

          name:
            input.value,

          price:
            0

        }));

  }


  /* =====================================================
     EMBUTIDOS DOBLE SANGUINARIO
  ===================================================== */

  if (
    currentProduct.name === "Doble Sanguinario"
  ) {

    const selected =
      document.querySelectorAll(
        'input[name="embutidos_doble_sanguinario"]:checked'
      );


    selections["Embutidos"] =
      Array.from(selected)
        .map(input => ({

          name:
            input.value,

          price:
            0

        }));

  }


  /* =====================================================
     EXTRAS
  ===================================================== */

  const selectedExtras =
    document.querySelectorAll(
      'input[name="extras"]:checked'
    );


  const extras = [];

  let extrasTotal =
    0;


  selectedExtras.forEach(input => {

    const price =
      Number(
        input.dataset.price || 0
      );


    extras.push({

      name:
        input.value,

      price:
        price

    });


    extrasTotal +=
      price;

  });


  selections["Extras"] =
    extras;


  /* =====================================================
     TOTAL
  ===================================================== */

  const subtotal =
    Number(
      (
        currentProduct.price +
        extrasTotal
      ).toFixed(2)
    );


  /* =====================================================
     NOTAS
  ===================================================== */

  const notes =
    pedidoNotas.value.trim();


  /* =====================================================
     ID
  ===================================================== */

  const id =
    Date.now() +
    Math.random()
      .toString(36)
      .substring(2, 8);


  /* =====================================================
     GUARDAR
  ===================================================== */

  CART.push({

    id:
      id,

    productName:
      currentProduct.name,

    basePrice:
      currentProduct.price,

    img:
      currentProduct.image,

    selections:
      selections,

    notes:
      notes,

    extrasTotal:
      extrasTotal,

    subtotal:
      subtotal

  });


  updateCartUI();

  closePedidoModal();


  alert(
    "¡Producto agregado al carrito! 🛒"
  );

}


/* =====================================================
   RESUMEN DE SELECCIONES
===================================================== */

function buildSummaryText(selections) {

  const lines = [];


  Object.entries(
    selections
  ).forEach(
    ([category, values]) => {


      /* =================================================
         EXTRAS
      ================================================= */

      if (
        category === "Extras"
      ) {

        if (
          values &&
          values.length
        ) {

          const extraText =
            values
              .map(
                extra =>
                  `${extra.name} (+${currency(extra.price)})`
              )
              .join(", ");


          lines.push(
            `Extras: ${extraText}`
          );

        }

        return;

      }


      /* =================================================
         RESTO
      ================================================= */

      if (
        values &&
        values.length
      ) {

        const text =
          values
            .map(item => {

              if (
                typeof item === "object"
              ) {

                if (
                  Number(item.price) === 0
                ) {

                  return `${item.name} (GRATIS)`;

                }


                return `${item.name} (+${currency(item.price)})`;

              }


              return item;

            })
            .join(", ");


        lines.push(
          `${category}: ${text}`
        );

      }

    }
  );


  return lines.join(" • ");

}


/* =====================================================
   ACTUALIZAR CARRITO
===================================================== */

function updateCartUI() {

  cartBtn.textContent =
    `Ver carrito (${CART.length})`;


  cartBody.innerHTML =
    "";


  if (
    CART.length === 0
  ) {

    cartBody.innerHTML =
      `
        <p class="small-muted">
          No hay pedidos aún.
        </p>
      `;


    cartSubtotalEl.textContent =
      "$0.00";


    return;

  }


  let total =
    0;


  CART.forEach(item => {

    total +=
      item.subtotal;


    const div =
      document.createElement("div");


    div.className =
      "cart-item";


    const summary =
      buildSummaryText(
        item.selections
      );


    div.innerHTML = `

      <div
        style="
          width:64px;
          height:56px;
          flex-shrink:0;
        "
      >

        <img
          src="${item.img}"
          alt="${escapeHtml(item.productName)}"
          style="
            width:64px;
            height:56px;
            object-fit:cover;
            border-radius:6px;
          "
        >

      </div>


      <div class="meta">

        <h4>

          ${escapeHtml(item.productName)}

          <span
            style="
              color:#666;
              font-weight:600;
              margin-left:4px;
            "
          >
            ${currency(item.subtotal)}
          </span>

        </h4>


        <p>
          ${escapeHtml(summary)}
        </p>


        ${
          item.notes
            ?
            `
              <p
                style="
                  margin-top:6px;
                "
              >

                <strong>
                  Notas:
                </strong>

                ${escapeHtml(item.notes)}

              </p>
            `
            :
            ""
        }

      </div>


      <button
        class="remove-item"
        data-id="${item.id}"
        type="button"
        style="
          background:#ff7f50;
          color:white;
          border:none;
          padding:6px;
          border-radius:7px;
          cursor:pointer;
        "
      >
        ✕
      </button>

    `;


    cartBody.appendChild(div);

  });


  cartSubtotalEl.textContent =
    currency(total);


  /* =====================================================
     ELIMINAR
  ===================================================== */

  cartBody
    .querySelectorAll(".remove-item")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          CART =
            CART.filter(
              item =>
                item.id !==
                button.dataset.id
            );


          updateCartUI();

        }
      );

    });

}


/* =====================================================
   VACIAR CARRITO
===================================================== */

function clearCart() {

  if (
    CART.length === 0
  ) {

    return;

  }


  if (
    !confirm(
      "¿Vaciar todo el carrito?"
    )
  ) {

    return;

  }


  CART = [];


  updateCartUI();

}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escapeHtml(str) {

  if (!str) {
    return "";
  }


  return String(str).replace(
    /[&<>"']/g,

    char => {

      const map = {

        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"

      };


      return map[char];

    }
  );

}


/* =====================================================
   WHATSAPP
===================================================== */

function sendCartWhatsApp() {

  if (
    CART.length === 0
  ) {

    alert(
      "El carrito está vacío."
    );

    return;

  }


  if (
    !/^\d{6,}$/.test(
      WHATSAPP_NUMBER
    )
  ) {

    alert(
      "Revisa el número de WhatsApp."
    );

    return;

  }


  let total =
    0;


  const messageLines = [];


  messageLines.push(
    "*PEDIDO GUATIQUESOS*"
  );


  messageLines.push("");


  CART.forEach(
    (item, index) => {

      messageLines.push(
        `*${index + 1}. ${item.productName}*`
      );


      messageLines.push(
        `Precio: ${currency(item.subtotal)}`
      );


      Object.entries(
        item.selections
      ).forEach(
        ([category, values]) => {


          /* =============================================
             EXTRAS
          ============================================= */

          if (
            category === "Extras"
          ) {

            if (
              values &&
              values.length
            ) {

              values.forEach(
                extra => {

                  messageLines.push(
                    `Extra: ${extra.name} (+${currency(extra.price)})`
                  );

                }
              );

            }

            return;

          }


          /* =============================================
             RESTO
          ============================================= */

          if (
            values &&
            values.length
          ) {

            const text =
              values
                .map(item => {

                  if (
                    typeof item === "object"
                  ) {

                    if (
                      Number(item.price) === 0
                    ) {

                      return `${item.name} (GRATIS)`;

                    }


                    return `${item.name} (+${currency(item.price)})`;

                  }


                  return item;

                })
                .join(", ");


            messageLines.push(
              `${category}: ${text}`
            );

          }

        }
      );


      if (
        item.notes
      ) {

        messageLines.push(
          `Notas: ${item.notes}`
        );

      }


      messageLines.push("");


      total +=
        item.subtotal;

    }
  );


  messageLines.push(
    `*TOTAL: ${currency(total)}*`
  );


  messageLines.push("");


  messageLines.push(
    "Por favor confirmar disponibilidad."
  );


  const message =
    messageLines.join("\n");


  const url =
    `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;


  window.open(
    url,
    "_blank"
  );

}


/* =====================================================
   EVENTOS
===================================================== */


/* CANCELAR */

closePedido.addEventListener(
  "click",
  closePedidoModal
);


/* AGREGAR AL CARRITO */

addToCartBtn.addEventListener(
  "click",
  addCurrentToCart
);


/* ABRIR CARRITO */

cartBtn.addEventListener(
  "click",
  () => {

    cartPanel.classList.add(
      "open"
    );


    cartPanel.setAttribute(
      "aria-hidden",
      "false"
    );

  }
);


/* CERRAR CARRITO */

closeCartBtn.addEventListener(
  "click",
  () => {

    cartPanel.classList.remove(
      "open"
    );


    cartPanel.setAttribute(
      "aria-hidden",
      "true"
    );

  }
);


/* VACIAR */

clearCartBtn.addEventListener(
  "click",
  clearCart
);


/* WHATSAPP */

sendWhatsAppBtn.addEventListener(
  "click",
  sendCartWhatsApp
);


/* CERRAR MODAL FUERA */

pedidoModal.addEventListener(
  "click",
  event => {

    if (
      event.target ===
      pedidoModal
    ) {

      closePedidoModal();

    }

  }
);


/* ESC */

document.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Escape"
    ) {

      closePedidoModal();


      cartPanel.classList.remove(
        "open"
      );

    }

  }
);


/* =====================================================
   INICIAR PÁGINA
===================================================== */

renderProducts();

updateCartUI();

</script>
