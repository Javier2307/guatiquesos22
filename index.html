<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Guatiquesos - Pedidos</title>


  <style>

    :root {

      --accent1: #ff7f50;
      --accent2: #ffce00;
      --bg: #fffbea;
      --green: #25D366;
      --dark: #222;
      --white: #fff;

    }


    * {

      box-sizing: border-box;

    }


    html {

      scroll-behavior: smooth;

    }


    body {

      margin: 0;

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        "Segoe UI",
        Roboto,
        "Helvetica Neue",
        Arial,
        sans-serif;

      background: var(--bg);

      color: var(--dark);

    }


    /* =====================================================
       HEADER
    ===================================================== */

    header {

      background:
        linear-gradient(
          90deg,
          var(--accent1),
          var(--accent2)
        );

      text-align: center;

      padding: 1rem 0;

      box-shadow:
        0 2px 8px rgba(0,0,0,0.15);

    }


    .logo-header {

      height: 150px;

      max-width: 90%;

      object-fit: contain;

      transition:
        transform .2s;

    }


    .logo-header:hover {

      transform:
        scale(1.05);

    }


    /* =====================================================
       CONTENIDO
    ===================================================== */

    main {

      max-width: 1100px;

      margin:
        18px auto;

      padding:
        0 12px;

    }


    h2 {

      text-align: center;

      color:
        var(--accent1);

      margin:
        25px 0 18px;

    }


    /* =====================================================
       PRODUCTOS
    ===================================================== */

    .productos,
    .bebidas-grid {

      display: grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(220px, 1fr)
        );

      gap: 14px;

    }


    .card {

      background:
        var(--white);

      border-radius:
        12px;

      padding:
        12px;

      box-shadow:
        0 6px 18px
        rgba(0,0,0,0.06);

      display:
        flex;

      flex-direction:
        column;

      justify-content:
        space-between;

      transition:
        transform .15s,
        box-shadow .15s;

    }


    .card:hover {

      transform:
        translateY(-6px);

      box-shadow:
        0 10px 28px
        rgba(0,0,0,0.12);

    }


    .card img {

      width: 100%;

      height: 150px;

      object-fit: cover;

      border-radius:
        8px;

      margin-bottom:
        8px;

      background:
        var(--bg);

    }


    .card h3 {

      margin:
        6px 0;

      font-size:
        1.02rem;

    }


    .precio {

      color:
        var(--accent1);

      font-weight:
        800;

      margin-bottom:
        6px;

    }


    .descripcion-corta {

      color:
        #555;

      font-size:
        .92rem;

      min-height:
        40px;

      margin-bottom:
        8px;

    }


    .card button {

      background:
        var(--accent2);

      border:
        none;

      padding:
        9px 10px;

      border-radius:
        8px;

      font-weight:
        700;

      cursor:
        pointer;

      transition:
        .2s;

    }


    .card button:hover {

      background:
        var(--accent1);

      color:
        white;

      transform:
        scale(1.03);

    }


    /* =====================================================
       BOTÓN CARRITO
    ===================================================== */

    .cart-btn {

      position:
        fixed;

      left:
        18px;

      bottom:
        18px;

      background:
        var(--green);

      color:
        white;

      border:
        none;

      padding:
        12px 14px;

      border-radius:
        12px;

      box-shadow:
        0 8px 20px
        rgba(0,0,0,0.2);

      font-weight:
        800;

      cursor:
        pointer;

      z-index:
        1200;

    }


    /* =====================================================
       FOOTER
    ===================================================== */

    footer {

      text-align:
        center;

      padding:
        12px;

      margin-top:
        25px;

      background:
        var(--accent2);

      font-weight:
        700;

    }


    /* =====================================================
       MODAL
    ===================================================== */

    .modal {

      display:
        none;

      position:
        fixed;

      inset:
        0;

      background:
        rgba(0,0,0,0.55);

      align-items:
        center;

      justify-content:
        center;

      padding:
        18px;

      z-index:
        1100;

    }


    .modal-content {

      width:
        100%;

      max-width:
        640px;

      max-height:
        86vh;

      overflow-y:
        auto;

      background:
        var(--bg);

      border-radius:
        12px;

      padding:
        14px;

      box-shadow:
        0 16px 40px
        rgba(0,0,0,0.25);

      animation:
        aparecer .25s ease;

    }


    @keyframes aparecer {

      from {

        opacity:
          0;

        transform:
          scale(.92);

      }

      to {

        opacity:
          1;

        transform:
          scale(1);

      }

    }


    .modal-header {

      display:
        flex;

      gap:
        12px;

      align-items:
        center;

    }


    .modal img {

      width:
        140px;

      height:
        110px;

      object-fit:
        cover;

      border-radius:
        8px;

    }


    .modal h3 {

      margin:
        0;

      font-size:
        1.15rem;

    }


    .modal .precio {

      margin:
        2px 0 0;

    }


    /* =====================================================
       GRUPOS
    ===================================================== */

    .group {

      background:
        rgba(255,255,255,.65);

      padding:
        10px;

      border-radius:
        8px;

      margin-top:
        10px;

      border:
        1px solid
        rgba(255,127,80,.15);

    }


    .group h4 {

      margin:
        5px 0 8px;

      color:
        var(--accent1);

      font-size:
        .98rem;

    }


    .group-description {

      font-size:
        .82rem;

      color:
        #666;

      margin-bottom:
        6px;

    }


    label.inline {

      display:
        flex;

      gap:
        8px;

      align-items:
        center;

      padding:
        5px 0;

      cursor:
        pointer;

    }


    label.inline input {

      cursor:
        pointer;

    }


    .extra-price {

      margin-left:
        auto;

      font-weight:
        800;

      color:
        var(--accent1);

    }


    /* =====================================================
       CONTADORES
    ===================================================== */

    .counter-info {

      background:
        #fff8d7;

      border:
        1px solid
        #ffe16b;

      padding:
        8px;

      border-radius:
        8px;

      margin-bottom:
        8px;

      font-size:
        .88rem;

      font-weight:
        700;

    }


    .error-message {

      display:
        none;

      background:
        #ffe1e1;

      color:
        #b30000;

      border:
        1px solid
        #ff9d9d;

      padding:
        9px;

      border-radius:
        8px;

      margin-top:
        10px;

      font-weight:
        700;

    }


    /* =====================================================
       COMENTARIOS
    ===================================================== */

    textarea {

      width:
        100%;

      min-height:
        66px;

      resize:
        none;

      padding:
        8px;

      border-radius:
        8px;

      border:
        1px solid
        #dcdcdc;

      margin-top:
        8px;

      font-family:
        inherit;

    }


    /* =====================================================
       BOTONES MODAL
    ===================================================== */

    .modal-actions {

      display:
        flex;

      justify-content:
        space-between;

      gap:
        8px;

      margin-top:
        12px;

    }


    .btn-secondary {

      background:
        var(--accent1);

      color:
        white;

      border:
        none;

      padding:
        9px 12px;

      border-radius:
        8px;

      cursor:
        pointer;

      font-weight:
        700;

    }


    .btn-primary {

      background:
        var(--green);

      color:
        white;

      border:
        none;

      padding:
        9px 12px;

      border-radius:
        8px;

      cursor:
        pointer;

      font-weight:
        800;

    }


    .btn-secondary:hover,
    .btn-primary:hover {

      transform:
        scale(1.03);

    }


    /* =====================================================
       CARRITO
    ===================================================== */

    .cart-panel {

      position:
        fixed;

      left:
        0;

      top:
        0;

      height:
        100vh;

      width:
        360px;

      max-width:
        92%;

      background:
        white;

      box-shadow:
        8px 0 30px
        rgba(0,0,0,.2);

      z-index:
        1300;

      transform:
        translateX(-100%);

      transition:
        transform .25s;

      display:
        flex;

      flex-direction:
        column;

    }


    .cart-panel.open {

      transform:
        translateX(0);

    }


    .cart-header {

      padding:
        12px;

      border-bottom:
        1px solid #eee;

      display:
        flex;

      justify-content:
        space-between;

      align-items:
        center;

    }


    .cart-body {

      padding:
        12px;

      overflow-y:
        auto;

      flex:
        1;

    }


    .cart-item {

      display:
        flex;

      gap:
        8px;

      padding:
        8px;

      border-radius:
        8px;

      background:
        var(--bg);

      margin-bottom:
        8px;

      align-items:
        flex-start;

    }


    .cart-item .meta {

      flex:
        1;

    }


    .cart-item h4 {

      margin:
        0 0 4px;

      font-size:
        .96rem;

    }


    .cart-item p {

      margin:
        0;

      font-size:
        .88rem;

      color:
        #444;

    }


    .cart-footer {

      padding:
        12px;

      border-top:
        1px solid #eee;

      display:
        flex;

      flex-direction:
        column;

      gap:
        8px;

    }


    .small-muted {

      font-size:
        .9rem;

      color:
        #666;

    }


    /* =====================================================
       TOTAL MODAL
    ===================================================== */

    .order-total {

      margin-top:
        12px;

      padding:
        10px;

      border-radius:
        8px;

      background:
        #fff;

      display:
        flex;

      justify-content:
        space-between;

      align-items:
        center;

      font-weight:
        800;

    }


    /* =====================================================
       BEBIDAS
    ===================================================== */

    .bebidas-seccion {

      margin-top:
        45px;

    }


    /* =====================================================
       RESPONSIVE
    ===================================================== */

    @media (max-width: 520px) {

      .logo-header {

        height:
          110px;

      }


      .modal img {

        display:
          none;

      }


      .modal-header {

        flex-direction:
          column;

        align-items:
          flex-start;

        gap:
          6px;

      }


      .cart-panel {

        width:
          100%;

        max-width:
          100%;

      }


      .modal-actions {

        flex-direction:
          column;

      }


      .btn-secondary,
      .btn-primary {

        width:
          100%;

      }

    }

  </style>

</head>

>

    </div>


    <form id="pedidoForm">

      <div

      ></div>


      <div class="order-total">

        </span>

        </span>

      </div>

        style="
          display:block;
          margin-top:10px;

      </label>


      <textarea

      <div class="modal-actions">

        <button
          type="button"
          class="btn-secondary"
          id="closePedido"
        >
          Cancelar
        </button>


        <button
          type="button"
          class="btn-primary"
          id="addToCartBtn"

          Agregar al carrito
        </button>

      </div>

    </form>

  </div>

</div>


<!-- =====================================================
     CARRITO
===================================================== -->

    </div>


    <div

        display:flex;
        gap:8px;
        margin-top:8px;
      "
    >

      <button

        type="button"
        style="
          flex:1;
          background:#ff7f50;

          border:none;

  </div>

</div>

/* =====================================================
   MONEDA
===================================================== */

function currency(number) {

  return "$" +
    Number(number).toFixed(2);

}


/* =====================================================
   IDENTIFICAR SANGUINARIOS
===================================================== */

function isSanguinario(product) {

  if (!product) {
    return false;
  }

  return (
    product.name === "Sanguinario" ||
    product.name === "Doble Sanguinario"
  );

}


/* =====================================================
   CONTORNOS REQUERIDOS
===================================================== */

function getRequiredContours(product) {

  if (!product) {
    return 0;
  }

  if (
    product.name === "Sanguinario"
  ) {

    return 3;

  }

  if (
    product.name === "Doble Sanguinario"
  ) {

    return 4;

  }

  return 0;

}

function handleContourSelection(event) {

  if (
    !currentProduct ||
    !isSanguinario(currentProduct)
  ) {

    return;

  }


  const required =
    getRequiredContours(
      currentProduct
    );


  const maxDeli =
    required - 2;


  const selected =
    document.querySelectorAll(
      'input[name="contorno_deli"]:checked'
    );


  if (
    selected.length >
    maxDeli
  ) {

    event.target.checked =
      false;


    alert(
      `${currentProduct.name} solo permite ${maxDeli} delicatessen como contorno(s) incluido(s).`
    );

  }


  updateModalTotal();

}


/* =====================================================
   SABER SI SE MARCÓ DELICATESSEN COMO EXTRA
===================================================== */

function getSelectedExtraDelicatessen() {

  const input =
    document.querySelector(
      'input[name="extras"][value="Delicatessen"]'
    );


  return !!(
    input &&
    input.checked
  );

/* =====================================================
   CALCULAR TOTAL
===================================================== */

function calculateModalTotal() {

  if (
    !currentProduct
  ) {

    return 0;

  }


  let total =
    currentProduct.price;


  const selectedExtras =
    document.querySelectorAll(
      'input[name="extras"]:checked'
    );


  selectedExtras.forEach(extra => {

    total +=
      Number(
        extra.dataset.price || 0
      );

  });


  return Number(
    total.toFixed(2)
  );

}

      calculateModalTotal()

/* =====================================================
   VALIDAR PRODUCTO
===================================================== */

function validateCurrentProduct() {

  if (
    !currentProduct
  ) {

    return {

      valid: false,

      message:
        "No se ha seleccionado ningún producto."

    };

  }


  /*
     TODOS LOS PANES

     Máximo 1 queso.
     El radio ya impide
     seleccionar más de uno.
  */

  const selectedCheese =
    document.querySelectorAll(
      'input[name="quesos"]:checked'
    );


  if (
    selectedCheese.length >
    1
  ) {

    return {

      valid: false,

      message:
        "Solo puedes seleccionar un tipo de queso."

    };

  }


  /*
     SANGUINARIO / DOBLE
  */

  if (
    isSanguinario(
      currentProduct
    )
  ) {

    const required =
      getRequiredContours(
        currentProduct
      );


    const cheeseCount =
      document.querySelectorAll(
        'input[name="quesos"]:checked'
      ).length;


    const hamCount =
      document.querySelectorAll(
        'input[name="jamones"]:checked'
      ).length;


    const deliCount =
      document.querySelectorAll(
        'input[name="contorno_deli"]:checked'
      ).length;


    /*
       QUESO
    */

    if (
      cheeseCount !== 1
    ) {

      return {

        valid: false,

        message:
          `${currentProduct.name} requiere exactamente 1 tipo de queso.`

      };

    }


    /*
       JAMÓN
    */

    if (
      hamCount !== 1
    ) {

      return {

        valid: false,

        message:
          `${currentProduct.name} requiere exactamente 1 tipo de jamón.`

      };

    }


    /*
       DELICATESSEN
    */

    if (
      deliCount !==
      required - 2
    ) {

      return {

        valid: false,

        message:
          `${currentProduct.name} requiere exactamente ${required - 2} delicatessen como contorno(s) incluido(s).`

      };

    }


    /*
       TOTAL DE CONTORNOS
    */

    const totalContours =
      cheeseCount +
      hamCount +
      deliCount;


    if (
      totalContours !==
      required
    ) {

      return {

        valid: false,

        message:
          `${currentProduct.name} requiere exactamente ${required} contornos.`

      };

    }

  }


  /*
     SI SE SELECCIONÓ EL EXTRA
     DELICATESSEN, DEBE ELEGIR
     UNA DELICATESSEN.
  */

  if (
    getSelectedExtraDelicatessen()
  ) {

    const paidDeli =
      document.querySelectorAll(
        'input[name="delicatessen_extra"]:checked'
      );


    if (
      paidDeli.length !== 1
    ) {

      return {

        valid: false,

        message:
          "Selecciona una delicatessen para el extra que agregaste."

      };

    }

  }


  return {

    valid: true,

    message: ""

  };

}

/* =====================================================
   AGREGAR PAN AL CARRITO
===================================================== */

function addCurrentToCart() {

  const validation =
    validateCurrentProduct();


  if (
    !validation.valid
  ) {

    showError(
      validation.message
    );

    return;

  }


  const selections = {};


  /*
     CATEGORÍAS
  */

  CATEGORIES.forEach(category => {

    const selected =
      document.querySelectorAll(
        `input[name="${category.name}"]:checked`
      );


    selections[
      category.title
    ] =
      Array.from(selected)
        .map(
          input =>
            input.value
        );

  });


  /*
     DELICATESSEN GRATIS
  */

  if (
    isSanguinario(
      currentProduct
    )
  ) {

    const selectedDeli =
      document.querySelectorAll(
        'input[name="contorno_deli"]:checked'
      );


    selections[
      "Embutidos / Delicatessen incluidos GRATIS"
    ] =
      Array.from(
        selectedDeli
      ).map(
        input =>
          input.value
      );

  }


  /*
     DELICATESSEN PAGADA
  */

  if (
    getSelectedExtraDelicatessen()
  ) {

    const selectedPaidDeli =
      document.querySelectorAll(
        'input[name="delicatessen_extra"]:checked'
      );


    selections[
      "Delicatessen extra"
    ] =
      Array.from(
        selectedPaidDeli
      ).map(
        input =>
          input.value
      );

  }


  /*
     EXTRAS
  */

  const selectedExtras =
    document.querySelectorAll(
      'input[name="extras"]:checked'
    );


  const extras = [];

  let extrasTotal =
    0;


  selectedExtras.forEach(input => {

    const price =
      Number(
        input.dataset.price || 0
      );


    extras.push({

      name:
        input.value,

      price:
        price

    });


    extrasTotal +=
      price;

  });


  selections["Extras"] =
    extras;


  /*
     TOTAL
  */

  const subtotal =
    Number(
      (
        currentProduct.price +
        extrasTotal
      ).toFixed(2)
    );


  /*
     NOTAS
  */

  const notes =
    pedidoNotas.value.trim();


  /*
     ID
  */

  const id =
    Date.now() +
    Math.random()
      .toString(36)
      .substring(2, 8);


  /*
     GUARDAR
  */

  CART.push({

    id:
      id,

    type:
      "bread",

    productName:
      currentProduct.name,

    basePrice:
      currentProduct.price,

    img:
      currentProduct.image,

    selections:
      selections,

    notes:
      notes,

    extrasTotal:
      extrasTotal,

    subtotal:
      subtotal

  });


  updateCartUI();

  closePedidoModal();


  alert(
    "¡Producto agregado al carrito! 🛒"
  );

}


/* =====================================================
   RESUMEN
===================================================== */

function buildSummaryText(selections) {

  const lines = [];


  Object.entries(
    selections
  ).forEach(
    ([category, values]) => {


      /*
         EXTRAS
      */

      if (
        category === "Extras"
      ) {

        if (
          values &&
          values.length
        ) {

          const extraText =
            values
              .map(
                extra =>
                  `${extra.name} (+${currency(extra.price)})`
              )
              .join(", ");


          lines.push(
            `Extras: ${extraText}`
          );

        }

        return;

      }


      /*
         RESTO
      */

      if (
        values &&
        values.length
      ) {

        lines.push(
          `${category}: ${values.join(", ")}`
        );

      }

    }
  );


  return lines.join(
    " • "
  );

}


/* =====================================================
   ACTUALIZAR CARRITO
===================================================== */

function updateCartUI() {

  cartBtn.textContent =
    `🛒 Ver carrito (${CART.length})`;


  cartBody.innerHTML =
    "";


  if (
    CART.length === 0
  ) {

    cartBody.innerHTML = `

      <p class="small-muted">
        No hay pedidos aún.
      </p>

    `;


    cartSubtotalEl.textContent =
      "$0.00";

    return;

  }


  let total =
    0;


  CART.forEach(item => {

    total +=
      item.subtotal;


    const div =
      document.createElement("div");

    div.className =
      "cart-item";


    /*
       BEBIDA
    */

    if (
      item.type ===
      "beverage"
    ) {

      div.innerHTML = `

        <div
          style="
            width:64px;
            height:56px;
            flex-shrink:0;
          "
        >

          <img
            src="${item.img}"
            alt="${escapeHtml(item.productName)}"
            style="
              width:64px;
              height:56px;
              object-fit:cover;
              border-radius:6px;
            "
          >

        </div>


        <div class="meta">

          <h4>

            ${escapeHtml(
              item.productName
            )}

            <span
              style="
                color:#666;
                font-weight:600;
                margin-left:4px;
              "
            >
              ${currency(item.subtotal)}
            </span>

          </h4>


          <p>
            🥤 Bebida
          </p>

        </div>


        <button
          class="remove-item"
          data-id="${item.id}"
          type="button"
          style="
            background:#ff7f50;
            color:white;
            border:none;
            padding:6px;
            border-radius:7px;
            cursor:pointer;
          "
        >
          ✕
        </button>

      `;

    }


    /*
       PAN
    */

    else {

      const summary =
        buildSummaryText(
          item.selections
        );


      div.innerHTML = `

        <div
          style="
            width:64px;
            height:56px;
            flex-shrink:0;
          "
        >

          <img
            src="${item.img}"
            alt="${escapeHtml(item.productName)}"
            style="
              width:64px;
              height:56px;
              object-fit:cover;
              border-radius:6px;
            "
          >

        </div>


        <div class="meta">

          <h4>

            ${escapeHtml(
              item.productName
            )}

            <span
              style="
                color:#666;
                font-weight:600;
                margin-left:4px;
              "
            >
              ${currency(item.subtotal)}
            </span>

          </h4>


          <p>
            ${escapeHtml(summary)}
          </p>


          ${
            item.notes
              ?
              `
                <p
                  style="
                    margin-top:6px;
                  "
                >

                  <strong>
                    Notas:
                  </strong>

                  ${escapeHtml(
                    item.notes
                  )}

                </p>
              `
              :
              ""
          }

        </div>


        <button
          class="remove-item"
          data-id="${item.id}"
          type="button"
          style="
            background:#ff7f50;
            color:white;
            border:none;
            padding:6px;
            border-radius:7px;
            cursor:pointer;
          "
        >
          ✕
        </button>

      `;

    }


    cartBody.appendChild(div);

  });


  cartSubtotalEl.textContent =
    currency(total);


  /*
     BOTONES ELIMINAR
  */

  cartBody
    .querySelectorAll(
      ".remove-item"
    )
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          CART =
            CART.filter(
              item =>
                item.id !==
                button.dataset.id
            );


          updateCartUI();

        }
      );

    });

}


/* =====================================================
   VACIAR CARRITO
===================================================== */

function clearCart() {

  if (
    CART.length === 0
  ) {

    return;

  }


  if (
    !confirm(
      "¿Vaciar todo el carrito?"
    )
  ) {

    return;

  }


  CART = [];


  updateCartUI();

}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escapeHtml(str) {

  if (
    str === null ||
    str === undefined
  ) {

    return "";

  }


  return String(str).replace(
    /[&<>"']/g,

    char => {

      const map = {

        "&":
          "&amp;",

        "<":
          "&lt;",

        ">":
          "&gt;",

        '"':
          "&quot;",

        "'":
          "&#39;"

      };


      return map[char];

    }
  );

}


/* =====================================================
   WHATSAPP
===================================================== */

function sendCartWhatsApp() {

  if (
    CART.length === 0
  ) {

    alert(
      "El carrito está vacío."
    );

    return;

  }


  if (
    !/^\d{6,}$/.test(
      WHATSAPP_NUMBER
    )
  ) {

    alert(
      "Revisa el número de WhatsApp."
    );

    return;

  }


  let total =
    0;


  const messageLines =
    [];


  messageLines.push(
    "*PEDIDO GUATIQUESOS*"
  );


  messageLines.push("");


  CART.forEach(
    (item, index) => {

      messageLines.push(
        `*${index + 1}. ${item.productName}*`
      );


      if (
        item.type ===
        "beverage"
      ) {

        messageLines.push(
          "Tipo: Bebida"
        );

      }


      messageLines.push(
        `Precio: ${currency(item.subtotal)}`
      );


      Object.entries(
        item.selections
      )
      .forEach(
        ([category, values]) => {


          /*
             EXTRAS
          */

          if (
            category === "Extras"
          ) {

            if (
              values &&
              values.length
            ) {

              values.forEach(extra => {

                messageLines.push(
                  `Extra: ${extra.name} (+${currency(extra.price)})`
                );

              });

            }

            return;

          }


          /*
             RESTO
          */

          if (
            values &&
            values.length
          ) {

            messageLines.push(
              `${category}: ${values.join(", ")}`
            );

          }

        }
      );


      if (
        item.notes
      ) {

        messageLines.push(
          `Notas: ${item.notes}`
        );

      }


      messageLines.push("");


      total +=
        item.subtotal;

    }
  );


  messageLines.push(
    `*TOTAL: ${currency(total)}*`
  );


  messageLines.push("");


  messageLines.push(
    "Por favor confirmar disponibilidad."
  );


  const message =
    messageLines.join("\n");


  const url =
    `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;


  window.open(
    url,
    "_blank"
  );

}


/* =====================================================
   EVENTOS
===================================================== */


/* Cerrar modal */

closePedido.addEventListener(
  "click",
  closePedidoModal
);


/* Agregar al carrito */

addToCartBtn.addEventListener(
  "click",
  addCurrentToCart
);


/* Abrir carrito */

cartBtn.addEventListener(
  "click",
  () => {

    cartPanel.classList.add(
      "open"
    );

    cartPanel.setAttribute(
      "aria-hidden",
      "false"
    );

  }
);


/* Cerrar carrito */

closeCartBtn.addEventListener(
  "click",
  () => {

    cartPanel.classList.remove(
      "open"
    );

    cartPanel.setAttribute(
      "aria-hidden",
      "true"
    );

  }
);


/* Vaciar carrito */

clearCartBtn.addEventListener(
  "click",
  clearCart
);


/* WhatsApp */

sendWhatsAppBtn.addEventListener(
  "click",
  sendCartWhatsApp
);


/* Cerrar modal haciendo clic fuera */

pedidoModal.addEventListener(
  "click",
  event => {

    if (
      event.target ===
      pedidoModal
    ) {

      closePedidoModal();

    }

  }
);


/* ESC */

document.addEventListener(
  "keydown",
  event => {

    if (
      event.key ===
      "Escape"
    ) {

      closePedidoModal();

      cartPanel.classList.remove(
        "open"
      );

      cartPanel.setAttribute(
        "aria-hidden",
        "true"
      );

    }

  }
);


/* =====================================================
   INICIAR
===================================================== */

renderProducts();

renderBeverages();

updateCartUI();

</script>
